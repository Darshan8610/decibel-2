name: Decibel Android Debug Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decibel-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android debug assemble
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Diagnose Android SDK environment
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          command -v sdkmanager || true
          ls -la /usr/local/lib/android/sdk 2>/dev/null || true
          find /usr/local/lib/android/sdk /opt -type f -name sdkmanager -print 2>/dev/null | head -20
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify wrapper
        run: chmod +x ./gradlew

      - name: Assemble Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace --no-daemon
