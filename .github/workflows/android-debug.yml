name: Decibel Android Debug Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decibel-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android debug assemble
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-37" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify wrapper
        run: chmod +x ./gradlew

      - name: Assemble Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace --no-daemon
