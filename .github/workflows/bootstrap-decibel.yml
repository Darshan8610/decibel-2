name: Bootstrap Decibel workspace

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-source:
    if: github.repository == 'Darshan8610/decibel-2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination workspace
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check out original Decibel source
        uses: actions/checkout@v4
        with:
          repository: Darshan8610/Decibel
          ref: main
          path: decibel-source
          lfs: true

      - name: Import source snapshot and remove bootstrap workflow
        run: |
          rsync -a --exclude='.git' decibel-source/ ./
          rm -f .github/workflows/bootstrap-decibel.yml
          rm -f .bootstrap-trigger
          rm -rf decibel-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import Decibel source snapshot"
          git push origin HEAD:main
